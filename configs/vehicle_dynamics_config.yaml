# Vehicle Dynamics Simulation Configuration
# Used by src/vehicle_dynamics/dynamics_sim.py

vehicle:
  mass: 1500.0          # kg
  wheelbase: 2.67       # meters
  cg_height: 0.54       # meters
  cg_to_front: 1.12     # meters
  frontal_area: 2.2     # m²
  drag_coeff: 0.30      # Cd
  tire_radius: 0.316    # meters (205/55R16)
  rolling_resistance: 0.015  # Crr

simulation:
  dt: 0.001             # seconds (1 ms timestep — stable for most conditions)
  max_time: 20.0        # seconds (max simulation duration)
  default_surface: "dry" # dry, wet, snow, ice, gravel
  default_grade: 0.0    # degrees (positive = uphill)

abs:
  enabled: true
  slip_threshold: 0.15  # ABS releases brake above this slip ratio
  slip_target: 0.10     # ABS targets this slip ratio
  cycle_time: 0.050     # seconds per ABS pressure cycle (50 ms)

output:
  save_dir: "results/vehicle_dynamics/"
  plot_speeds: [30, 50, 80, 100]  # km/h values for comparison plots
